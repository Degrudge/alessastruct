name: build

on:
  workflow_dispatch: 

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main
    - name: dependencies
      run: sudo apt install -y ninja-build
    - name: Clone llvm
      uses: actions/checkout@main
      with:
        repository: llvm/llvm-project
        path: llvm
    - name: Clone alessastruct
      uses: actions/checkout@main
      with:
        repository: Degrudge/alessastruct
        path: llvm/clang-tools-extra/alessastruct
    - name: Add alessastruct to CMakeList
      working-directory: llvm/clang-tools-extra
      run: echo "add_subdirectory(alessastruct)" >> CMakeLists.txt
    - name: run CMake
      working-directory: llvm
      run: |
       mkdir build && cd build; \
       cmake -G Ninja ../llvm -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" \
       -DLLVM_TARGETS_TO_BUILD=X86 -DCMAKE_BUILD_TYPE=Release
    - name: Build Clang
      working-directory: llvm/build
      run: ninja

    - name: (test) check dir
      working-directory: llvm/build/bin
      run: ls -la

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: alessastruct-bin
        path: llvm/build/bin/alessastruct
      
