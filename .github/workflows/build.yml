name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: dependencies
      run: sudo apt install -y ninja-build
    - name: Clone llvm
      uses: actions/checkout@v4
      with:
        repository: llvm/llvm-project
        path: llvm
    
    - name: CMake on Clang
      working-directory: llvm
      run: |
       mkdir build && cd build; \
       cmake -G Ninja ../llvm -DLLVM_ENABLE_PROECT="clang;clang-tools-extra" \
       -DCMAKE_BUILD_TYPE=Release -DLLVM_BUILD_TESTS=ON
    - name: Build Clang
      working-directory: llvm
      run: |
        ninja; ninja install
